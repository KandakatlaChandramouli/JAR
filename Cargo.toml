[package]
name = "jar"
version = "1.0.0"
edition = "2021"
description = "A Linux process-isolation container runtime prototype written in pure Rust"
authors = ["JAR Project"]

[dependencies]
nix = { version = "0.29", features = ["process", "sched", "mount", "user", "fs"] }
libseccomp = "0.3"
libc = "0.2"
caps = "0.5"
tar = "0.4"
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
